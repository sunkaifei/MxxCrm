# ============================================================
# Mxx-CRM 后端静态配置（backend/config/config.ini）
# 说明：
#  1. 本文件在服务启动时一次性加载（config.rs），修改后必须重启后端生效
#  2. 运行期可后台切换的业务配置（如网站模板 pc_template、会话时长
#     access_token_expire、多设备 login_multi_device 等）存放在
#     mxx_system_config 表，由各自专用业务配置页面维护（登录安全、
#     出入库审核等），此处不再冗余
#  3. 含密钥/连接串等敏感信息，请勿提交到公开仓库
# ============================================================

[server]
# 对外访问地址（用于拼接微信支付回调 notify_url，并展示于启动日志）
server_url=https://www.mxxshop.com
# HTTP 监听地址（安装模式固定 127.0.0.1）
server_host=127.0.0.1
# HTTP 监听端口
server_port=8088
# 管理后台访问前缀（自定义，用于隐藏后台地址；如 /console）
# 前端需要以相对路径 base（VITE_BASE=./）构建；修改后重启后端生效。
# 注意：该前缀会占用顶层路径段，CMS 栏目/内容模型的 short_url 请不要与其冲突
admin_prefix=/console
# SaaS 子域校验主域：open 站点接口按请求 Host 解析子域时，
# Host 主域必须等于本值，否则报"二级域名格式错误"
saas_domain=abc.com
# admin 端 JWT 签名密钥（泄露可伪造登录态，生产环境务必改为强随机串）
jwt_secret_admin=7425d38dd1d0a754a3607c9d007e03907c2ffe9da7b5c56354083f047c6931e8
# user/会员端 JWT 签名密钥（与 admin 端区分，勿共用）
jwt_secret_user=9c9c4729e6fd0c876c307e7b3c863a33cf93f7a311abfac598cdfb3d2e9cb06f
# user/会员端 token 有效期（秒）；admin 端有效期以 mxx_system_config.access_token_expire 为准
jwt_expire_user=28800
# 缓存类型：mem（进程内存，默认）| redis
# （改为 redis 时需另配 [database] 节 redis_url，见文件尾部说明）
cache_type=mem
# 演示站开关：开启后拦截核心业务写操作（新增/编辑/删除），仅只读
demo_mode=false
# 全文检索索引名前缀（search 模块）
index_name=search_index
# 免鉴权接口清单（逗号分隔，按路径前缀匹配，如登录/注册/支付回调）
permission_exclude_urls=/api/system/auth/login,/api/system/auth/logout,/api/system/auth/refresh,/api/user/auth/login,/api/user/auth/logout,/api/user/wechat/login,/api/system/auth/captcha,/api/system/auth/register-status,/api/system/auth/register,/api/system/auth/check-username,/api/system/auth/mfa/verify,/api/system/auth/mfa/enroll,/api/system/auth/mfa/enroll/confirm,/api/system/auth/forgot_password,/api/system/auth/reset_password,/api/system/auth/register/email_code,/api/system/auth/sso/,/api/finance/payment/wechat-notify,/api/system/chat/,/api/system/my-notification/,/api/system/dept/tree
# 权限/会话缓存 TTL（秒，缓存冷启动后按该值回填）
permission_cache_ttl=300

[db]
# PostgreSQL 连接串：postgres://用户:密码@主机:端口/数据库
url=postgres://postgres:123456@127.0.0.1:5432/mxxcrm_data
# 连接池最大连接数
max_connections=20
# 连接池保底空闲连接数
min_connections=5
# 建立连接超时（秒）
connect_timeout=20
# 从连接池获取连接的超时（秒）
acquire_timeout=10
# 空闲连接回收时间（秒）
idle_timeout=300
# 连接最长存活时间（秒）
max_lifetime=3600
# 慢查询告警阈值（秒）
acquire_slow_threshold=5
# 是否打印 SQL 日志
logging=false
# SQL 日志级别（trace/debug/info/warn/error）
logging_level=debug

# 说明：将 [server] cache_type 改为 redis（或接入会话 redis 存储）时，
# 需启用下面配置（代码读取键为 database.redis_url，并非旧的 [redis] 段）：
# [database]
# redis_url=redis://127.0.0.1:6379

[attach]
# 附件（头像/文件等）物理存储目录
attach_path=./storage/Attach/
# 上传文件物理存储根目录
upload_path=./storage/upload/
# 上传文件访问 URL 前缀（开发环境由前端代理 /upload 到后端）
upload_url=/upload/
# 静态资源 CDN 地址（留空则按 upload_url 生成相对/同源路径）
static_url=

[backup]
# 数据库备份输出目录
output_dir=./storage/backup/
# 备份保留天数（超期自动清理，最小 1 天）
keep_days=14
# pg_dump 可执行文件路径（生成备份）
#   留空 = 自动探测：优先系统 PATH，其次常见安装目录
#     - Linux : /usr/bin、/usr/local/bin、/usr/lib/postgresql/<版本>/bin、/usr/pgsql-<版本>/bin
#     - Windows: C:/Program Files/PostgreSQL/<版本>/bin
#   也可显式指定，如 Linux: /usr/bin/pg_dump   Windows: C:/Program Files/PostgreSQL/16/bin/pg_dump.exe
pg_dump_path=
# pg_restore 可执行文件路径（还原备份；留空则按 pg_dump_path 同目录自动推断）
pg_restore_path=

[wechat]
# 微信支付配置兜底：后台「接口配置中心」integration_config（wechat_pay）未配置时读本段
# 实际读取项：app_id / mchid / cert_path / key_path / platform_cert_path
# 注意：V3 回调验签密钥 api_v3_key 直接读取本段，缺失需在后台/本段补齐
app_id=wx2384cfda6cc622d4
# V3回调验签密钥（开发环境测试值，生产请从微信商户平台获取后替换）
api_v3_key=mxxcrmdevcallbackkey1234567890ab

[time]
# 业务时区（时间计算与展示口径）
timezone=Asia/Shanghai
