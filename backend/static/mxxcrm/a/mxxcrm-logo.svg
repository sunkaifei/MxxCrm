<svg xmlns="http://www.w3.org/2000/svg" width="118" height="33" viewBox="0 0 118 33" role="img" aria-label="迈客 MxxCRM">
  <defs>
    <linearGradient id="mbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f54eb"/>
      <stop offset="1" stop-color="#722ed1"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f54eb"/>
      <stop offset="1" stop-color="#722ed1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#2f54eb" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 带框 M：135° 蓝紫渐变圆角方块，几何自绘 M 保证跨平台一致 -->
  <rect x="0.5" y="0.5" width="32" height="32" rx="8" fill="url(#mbox)" filter="url(#soft)"/>
  <path d="M 9 23.5 L 9 10 L 16.5 18.5 L 24 10 L 24 23.5"
        fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 中文主字与英文副字 textLength 等宽对齐（44px），spacing 模式自动分配字距 -->
  <text x="41" y="17" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="16.5" font-weight="600" fill="#181C25"
        textLength="44" lengthAdjust="spacing">迈客</text>
  <text x="41" y="28.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="8" font-weight="700"
        textLength="44" lengthAdjust="spacing"
        fill="url(#tint)">MxxCRM</text>
</svg>
