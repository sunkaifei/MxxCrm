<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="MxxCrm 客户关系管理系统" />
    <meta name="keywords" content="MxxCrm CRM Vue3" />
    <meta name="author" content="MxxCrm" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <!--
      首屏 loading 不写在 index.html 里：
      @vben/vite-config 的 inject-app-loading 插件会向 <body> 注入它自己的
      loading 节点（z-index 9999），写在 #app 里的骨架会被完全遮住。
      因此改为提供 `loading.html` 自定义模板来接管该节点，详见该文件。
    -->
    <div id="app"></div>
    <noscript>
      <div style="padding: 24px; text-align: center">
        当前浏览器禁用了 JavaScript，请启用后访问本系统。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
