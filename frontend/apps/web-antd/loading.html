<!--
  自定义首屏 loading（覆盖 @vben/vite-config 的 default-loading.html）

  生效方式：`viteInjectAppLoadingPlugin` 会优先读取 `<app 根目录>/loading.html`，
  存在则用它替换内置模板，并注入到 index.html 的 <body> 开头。

  ⚠️ 两条硬性约定，改动时不得破坏：
  1. 根节点必须保留 `id="__app-loading__"` —— unmountGlobalLoading() 用它查找节点；
  2. `.loading.hidden` 必须带 **transition** —— 框架是靠 `transitionend` 事件
     才真正 remove 掉本节点的。若去掉过渡，loading 将永远停留在页面上。

  参考：packages/utils/src/helpers/unmount-global-loading.ts
-->
<style data-app-loading="inject-css">
  html {
    /* 与 ant-design-vue/dist/reset.css 保持一致，避免标题行高变化 */
    line-height: 1.15;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f7f9;
    font-family:
      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
      Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  /* 关键：必须有过渡，框架依赖 transitionend 移除本节点 */
  .loading.hidden {
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease-out;
  }

  .dark .loading {
    background: #141414;
  }

  .boot-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .boot-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    font-size: 23px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #2f54eb, #722ed1);
    border-radius: 11px;
    box-shadow: 0 8px 20px rgb(47 84 235 / 30%);
  }

  .boot-name {
    font-size: 22px;
    font-weight: 600;
    color: rgb(0 0 0 / 85%);
    letter-spacing: 0.5px;
  }

  .dark .boot-name {
    color: #e5e6eb;
  }

  .boot-bar {
    position: relative;
    width: 180px;
    height: 3px;
    overflow: hidden;
    background: #e5e6eb;
    border-radius: 3px;
  }

  .dark .boot-bar {
    background: #2a2a2a;
  }

  .boot-bar span {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, #2f54eb, transparent);
    animation: boot-slide 1.1s ease-in-out infinite;
  }

  .boot-tip {
    font-size: 13px;
    color: #8a9099;
  }

  .dark .boot-tip {
    color: #6b6f76;
  }

  @keyframes boot-slide {
    0% {
      transform: translateX(-100%);
    }

    100% {
      transform: translateX(100%);
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <div class="boot-brand">
    <div class="boot-logo">M</div>
    <div class="boot-name">%VITE_APP_TITLE%</div>
  </div>
  <div class="boot-bar"><span></span></div>
  <div class="boot-tip">正在加载系统资源…</div>
</div>
